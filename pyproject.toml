[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempotrack"
version = "0.1.0"  # Replace with your actual version
description = "TempoTrack: Memory as Anchor for Open-Vocabulary Tracking"
readme = "README.md"
keywords = ["instance matching", "object tracking"]
license = {text = "Apache-2.0"}

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">= 3.11"

dependencies = [
    "wheel",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.38.2",
    "tokenizers",
    "numpy",
    "opencv-python",
    "supervision",
    "openmim",
    "mmcv==2.1.0",
    "mmengine",
    "nltk",
    "h5py",
    "einops",
    "seaborn",
    "fairscale",
    # Additional dependencies installed via Git are listed in the installation script
]

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE"]
zip-safe = true

[tool.setuptools.packages.find]
where = ["."]
include = ["masa*", "tempotrack_research*"]
exclude = ["docs*", "tests*", "third_party*", "assets*"]
