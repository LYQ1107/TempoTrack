schema_version: 3
name: tempotrack-repair-v3
base_commit: 216aed1dbfd9aba19e78077f7b6a34f702b722ea
protocol:
  observation_source: predicted_boxes
  frozen_detic_masa: true
  ratio: 2
  immutable_observations: true
  gt_boxes_at_inference: false
  official_validation_in_training: false
  candidate_k: 8
execution:
  run_full: true
  seed_order: [0, 1, 2]
  all_core_seed0_before_repeat_seeds: true
  train_infer_evaluate_chain: true
  max_parallel_jobs: 1
  continue_independent_failures: true
  max_retries_per_unchanged_signature: 0
  heartbeat_seconds: 30
  checkpoint_on_stop: true
  integration_limit_videos: 2
training:
  budgets:
    predictive_dual: 3000
    ordinary_metric: 3000
    s1_jepa: 3000
    s2_state_fm: 3000
    s3_graph_fm: 3000
    s4_graph_diffusion: 3000
    s5_bc: 3000
    s5_ppo_transitions: 50000
  full_budgets:
    predictive_dual: 60000
    ordinary_metric: 100000
    s1_jepa: 100000
    s2_state_fm: 100000
    s3_graph_fm: 120000
    s4_graph_diffusion: 120000
    s5_bc: 30000
    s5_ppo_transitions: 2000000
  microbatch_size: 8
  effective_batch: 32
  accumulation_steps: 4
  ppo_microbatch_size: 64
  validate_every: 2000
  save_every: 500
  grad_clip: 1.0
  amp: bf16_if_supported
  matched_fraction: 0.8
  clean_fraction: 0.2
methods:
  - m0_no_offline
  - m0_stable_emd
  - m0_ordinary_metric
  - m0_s1_jepa
  - m0_s2_state_fm
  - m0_s3_graph_fm
  - m0_s4_graph_diffusion
  - m0_s5_bc
  - m0_s5_ppo
  - m1_no_offline
  - m1_stable_emd
  - m1_ordinary_metric
  - m1_s1_jepa
  - m1_s2_state_fm
  - m1_s3_graph_fm
  - m1_s4_graph_diffusion
  - m1_s5_bc
  - m1_s5_ppo
controls:
  m1_memory:
    - single_ema
    - fixed_dual
    - confidence_gated_dual
    - predictive_dual
  s1:
    - ordinary_metric
    - prediction_loss_off
    - shuffled_history
  s2:
    - gaussian
    - mdn
    - cvae
  s5:
    - bc
    - bc_ppo
    - deterministic_local_edit
