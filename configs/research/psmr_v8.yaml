schema_version: 8
method: PSMR
algorithm_revision: per_anchor_v8
seed: 0
observation_protocol:
  source: ratio2_frozen_Detic_MASA_features
  immutable_fields: [video_id, image_id, frame_index, bbox, score, category_id, observation_uid]
  mutable_fields: [track_id]
  official_validation_not_in_training: true
  use_gt_boxes: false
  use_novel_gt_in_optimizer: false
memory:
  alpha_fast: 0.70
  alpha_slow: 0.15
  dedup_cos: 0.95
  capacity: 64
partial_support:
  query_observations: 1
  top_r: 3
  memory_capacity: 64
  dedup_cos: 0.95
  max_gap: 60
  candidate_top_k: 8
  eps: 1.0e-6
reactivation:
  fast_accept_threshold: 0.60
  score_threshold: 0.60
  margin_threshold: 0.0
  max_query_observations: 4
training:
  max_steps: 20000
  lr: 0.001
  weight_decay: 0.0001
  temperature: 0.07
  grad_clip: 1.0
  save_every: 500
  log_every: 100
  loss: L_rank_plus_0.5_L_rel_per_anchor
  supervision: base_only_retained_anchor_consistency
calibration:
  split: val_base_internal
  precision_floor: 0.95
  thresholds: internal_only
  candidates: [1, 3, 5]
evaluation:
  evaluator: tools/eval_ovmot_teta.py
  cores: 8
