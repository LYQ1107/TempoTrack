schema_version: 4
repo_root: /data1/LWR/vranlee/SERVER_ONLY/avis/masa
reference_root: outputs/research_v3
frozen_observation_reference: outputs/research_v2/prepared/prepared_manifest.json
run_root: outputs/research_v4
research_python: /home/lwr/anaconda3/envs/masaenv/bin/python
legacy_python: /home/lwr/anaconda3/envs/masaenv/bin/python
legacy_env:
  ld_preload: /home/lwr/anaconda3/envs/masaenv/lib/libsqlite3.so.3.52.0
resources:
  mode: independent_jobs
  device_policy: auto-idle
  allowed_devices: auto_allocated_idle
  respect_scheduler_allocation: true
  skip_unrelated_compute_processes: true
  exclusive_gpu_per_job: true
  max_jobs_per_gpu: 1
  max_parallel_gpu_jobs: auto
  max_parallel_cpu_jobs: 2
  cpu_threads_per_gpu_job: 4
  evaluator_cores: 2
  gpu_memory_headroom_gib: 2
  lock_dir: ~/.cache/tempotrack/gpu_leases
  allow_downloads: false
  allow_paid_services: false
execution:
  continue_independent_failures: true
  retries_per_unchanged_failure: 0
  all_runnable_trial0_before_full0: true
  all_runnable_full0_before_repeat_seeds: true
  evaluate_each_completed_model: true
  stop_healthy_jobs_at_session_end: false
  heartbeat_seconds: 30
  poll_seconds: 2
  checkpoint_on_requested_stop: true
extractor:
  config: configs/masa-detic/open_vocabulary_mot_test/masa_detic_swinb_open_vocabulary_test.py
  model_checkpoint: saved_models/masa_models/detic_masa.pth
  detector_checkpoint: null
  category_mapping: data/tao/annotations/tao_val_lvis_v1_classes.json
  observation_source: predicted_boxes
  ratio: 2
  optional_gt_boxes: false
  admission:
    score_thr: 0.0001
    nms_iou: null
    max_per_frame: 50
splits:
  train_annotation: data/tao/annotations/train.json
  validation_annotation: data/tao/annotations/validation.json
  category_protocol: data/tao/annotations/tao_val_lvis_v1_classes.json
  frame_root: data/tao/frames
data:
  episode_split: train_base
  candidate:
    max_gap: 90
    top_k: 20
    candidate_k: 8
    with_cats: false
    graph_window_max_nodes: 96
    graph_window_overlap: 16
  frontend:
    max_gap: 90
    match_score_thr: 0.5
    fast_accept_threshold: 0.55
    with_cats: false
    mode: fixed_dual
    action_table_limit: 256
  transform_snapshot:
    schema_version: 4
    time_unit: frame
    time_scale: 1.0
    max_source_tokens: 16
    max_target_tokens: 8
  cache_videos: 4
optimizer:
  lr: 0.0002
  weight_decay: 0.05
train:
  microbatch_size: 8
  accumulation_steps: 4
  effective_batch: 32
  num_workers: 0
  pin_memory: true
  amp: bf16_if_supported
  validate_every: 2000
  save_every: 500
  grad_clip: 1.0
infer:
  mode: forward_only
  samples: 4
  steps: 32
  max_edits: 256
  action_table_limit: 256
  deterministic: true
evaluation:
  cores: 1
  evaluator_python: /home/lwr/anaconda3/envs/masaenv/bin/python
